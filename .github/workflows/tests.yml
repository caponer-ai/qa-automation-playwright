name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, api, scraper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m ${{ matrix.suite }} -n auto --reruns 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.suite }}
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qa-automation .
      - run: docker run --rm qa-automation
