name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly run catches changes on the third-party demo sites
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy pages scraper clients settings.py

  tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, api, scraper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - run: playwright install --with-deps chromium
      - run: pytest -m ${{ matrix.suite }} -n auto -rxX
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qa-automation .
      - run: docker run --rm qa-automation pytest -m "not live" -n auto
