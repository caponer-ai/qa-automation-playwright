name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly run catches changes on the third-party demo sites
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # a hung step fails the job instead of holding a runner for 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m unit -p no:xdist # browser-free tests of the test infrastructure

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui
            select: "ui and not perf"
            browser: true
          - suite: api
            select: "api"
            browser: false # API tests use Playwright's HTTP client only
          - suite: scraper
            select: "scraper and not live"
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - if: matrix.browser
        run: playwright install --with-deps chromium
      - run: pytest -m "${{ matrix.select }}" -n auto -rxX
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  # Timing on shared runners and drift of third-party markup are signals, not merge gates.
  signals:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "perf or live" -p no:xdist -rxX

  docker:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qa-automation .
      # offline suite only: proves the image runs the tests without depending on third-party sites
      - run: docker run --rm qa-automation pytest -m "scraper and not live" -n auto
